<!DOCTYPE html>
<html lang="en">
<Head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>Contact Us - Laundry Express</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #2ae2dc;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container {
            width: 80%;
            margin: auto;
            padding: 20px;
        }
        .contact-info {
            margin-bottom: 30px;
        }
        .contact-info p {
            font-size: 18px;
        }
        form {
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #2a7ae2;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1d5bbf;
        }
    </style>
</Head>

<body>

<header>
    <h1>Contact Us</h1>
    <p>Laundry Express</p>
</header>
<nav>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="products_services.html">Products & Services</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>
</nav>

<div class="container">

    <div class="contact-info">
        <h2>Get in Touch</h2>
        <p><strong>Phone:</strong> 012 345 6789</p>
        <p><strong>Email:</strong> info@laundryexpress.com</p>
        <p><strong>Address:</strong> 123 Clean Street, Cape Town</p>
    </div>

    <form>
        <h2>Send us a Message</h2>

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Submit</button>
    </form>

</div>
<footer>
    <p>2026 Laundry Express. All Rights Reserved.</p>
</footer>
</body>
</html>
